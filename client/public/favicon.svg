<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </radialGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Coin / Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)"/>
  <circle cx="32" cy="32" r="29" stroke="url(#goldRim)" stroke-width="1.8" stroke-dasharray="8 3" opacity="0.9"/>
  <circle cx="32" cy="32" r="26" stroke="#a855f7" stroke-width="1" opacity="0.4"/>

  <!-- Glowing Lightning Bolt -->
  <path d="M35 8L18 34H31L27 56L46 28H33L35 8Z" 
        fill="url(#boltGrad)" 
        filter="url(#neonGlow)"
        stroke="#ffffff"
        stroke-width="0.8"
        stroke-linejoin="round"/>
</svg>